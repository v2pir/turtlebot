amcl:
  ros__parameters:
    # Motion model noise — very low for sim where odometry is near-perfect
    alpha1: 0.005
    alpha2: 0.005
    alpha3: 0.005
    alpha4: 0.005
    alpha5: 0.0

    # Update much more frequently (defaults: 0.25m / 0.2rad)
    update_min_d: 0.05
    update_min_a: 0.05

    # More particles for better coverage in a sparse-feature room
    min_particles: 2000
    max_particles: 5000

    # Sensor model — trust laser hits more (sim laser is accurate)
    z_hit: 0.8
    z_rand: 0.2
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.1
    max_beams: 120

    # Enable adaptive particle recovery
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    # Standard settings
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 3.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    tf_broadcast: true
    transform_tolerance: 1.0
    resample_interval: 1
    scan_topic: scan
    pf_err: 0.05
    pf_z: 0.99
    save_pose_rate: 0.5
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
